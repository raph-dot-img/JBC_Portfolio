# Ce fichier est un *modèle* : l'image nginx le copie dans conf.d/ au démarrage
# en remplaçant ${FORMSPREE_ENDPOINT} par la valeur du .env (envsubst).
# Seules les variables d'environnement définies sont remplacées : les
# variables nginx ($uri, $remote_addr...) ne sont pas touchées.

# Inutile d'annoncer la version exacte de nginx dans chaque réponse.
server_tokens off;

# Copie du journal d'accès dans ./logs/ (monté depuis l'hôte), en plus de
# stdout : les logs de `docker logs` disparaissent à chaque recréation du
# conteneur, ce fichier-là survit. Même format « main » que nginx.conf.
access_log /var/log/portfolio/acces.log main;

# Le HTTPS est assuré par le serveur distant (Nginx Reverse Proxy, devant FRP).
# Ce conteneur ne reçoit donc que du HTTP en clair, relayé par frpc : sans
# rien faire, $remote_addr serait l'adresse du conteneur frpc. On récupère la
# vraie IP du visiteur dans l'en-tête X-Forwarded-For posé par le proxy distant,
# en ne faisant confiance qu'aux adresses privées (réseau Docker, tunnel).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Domaines secondaires (*.caignec.eu, dont www) : redirection permanente vers
# le domaine canonique. Sans cela, le même site existerait à plusieurs
# adresses et les moteurs de recherche traiteraient les copies comme du
# contenu dupliqué.
server {
    listen 80;
    server_name *.caignec.eu;
    return 301 https://caignec.eu$request_uri;
}

# Domaine canonique
server {
    listen 80 default_server;
    server_name caignec.eu _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # nginx ne voit que du HTTP en clair : une redirection absolue sortirait
    # donc en http://. En relatif, le navigateur garde le https:// d'origine.
    absolute_redirect off;

    # Pages d'erreur personnalisées
    error_page 400 /erreurs/400.html;
    error_page 401 /erreurs/401.html;
    error_page 403 /erreurs/403.html;
    error_page 404 /erreurs/404.html;
    error_page 429 /erreurs/429.html;
    # Clin d'œil aux scanners : voir le bloc plus bas
    error_page 418 /erreurs/418.html;
    error_page 500 /erreurs/500.html;
    error_page 502 /erreurs/502.html;
    error_page 503 /erreurs/503.html;

    # Servies uniquement en interne, pas joignables directement.
    # SSI activé pour que la page 418 affiche l'IP du visiteur.
    location ^~ /erreurs/ {
        internal;
        ssi on;
    }

    # Chemins que seuls les scanners automatisés vont chercher (/admin, /.env,
    # /wp-login.php, /phpmyadmin...). Rien de tout cela n'existe ici, alors
    # plutôt qu'un 404 sec on leur sert un 418 et un chat smug.
    # Liste à garder identique à CHEMINS_SCANNERS dans serve.py.
    location ~* ^/(?:admin|administrator|wp-admin|wp-login\.php|cpanel|panel|manage|management|backend|dashboard|\.env|config\.php|config\.json|wp-config\.php|\.git|\.aws|database\.yml|wp-content|wp-includes|xmlrpc\.php|joomla|drupal|typo3|laravel|phpinfo\.php|info\.php|server-status|server-info|debug|test\.php|actuator|phpmyadmin|pma|adminer\.php|dbadmin|\.ssh|backup\.(?:sql|zip)|\.htpasswd|\.htaccess|api|graphql|swagger|docker-compose\.ya?ml|\.docker|frpc?\.toml|serve\.py|nginx|frp|logs)(?:[/.-]|$) {
        # (la page 418 porte elle-même un <meta name="robots" content="noindex">)
        access_log off;
        return 418;
    }

    # Page d'accueil : l'adresse du formulaire Formspree vient du .env.
    location = /index.html {
        sub_filter_once on;
        sub_filter "__FORMSPREE_ENDPOINT__" "${FORMSPREE_ENDPOINT}";
        include /etc/nginx/securite.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        access_log off;
    }

    # Licence MIT en texte brut, affichée plutôt que téléchargée
    location = /LICENSE {
        default_type text/plain;
    }

    # Le CV reste téléchargeable mais n'est pas indexé
    location = /assets/CV_Jean-Baptiste_CAIGNEC.pdf {
        include /etc/nginx/securite.conf;
        add_header X-Robots-Tag "noindex" always;
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~* \.(css|js|svg|gif|png|pdf|woff2)$ {
        include /etc/nginx/securite.conf;
        expires 1h;
        add_header Cache-Control "public";
    }

    # En-têtes de sécurité de base
    include /etc/nginx/securite.conf;

    gzip on;
    # text/html est toujours compressé par nginx : le répéter déclenche un avertissement.
    gzip_types text/css text/plain application/javascript application/xml image/svg+xml;
}
